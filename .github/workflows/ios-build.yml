name: ios-build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    container: swift:5.9
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck protocol core (Foundation only)
        run: |
          swiftc -typecheck \
            Sources/EquilMTMKit/CRC.swift \
            Sources/EquilMTMKit/Message.swift \
            Sources/EquilMTMKit/Frame.swift \
            Sources/EquilMTMKit/Commands.swift \
            Sources/EquilMTMKit/History.swift
          echo "typecheck OK"

  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild \
            -project EquilMTM.xcodeproj \
            -scheme EquilMTM \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 120

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr EquilMTM-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: EquilMTM-ipa
          path: EquilMTM-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
